<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<title>Where a trade's fee goes: buyer, Uniswap v4 pool, locked position, founder</title>
<defs>
