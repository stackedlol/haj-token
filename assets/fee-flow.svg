<path d="M0,0.8 L7,4 L0,7.2" fill="none" stroke="#8b9099" stroke-width="1.2"/>
</marker>
</defs>
<g stroke="#8b9099" stroke-width="1.4" fill="none">
<line x1="76" y1="62" x2="232" y2="62" marker-end="url(#a)"/>
<line x1="268" y1="62" x2="442" y2="62" marker-end="url(#a)"/>
<line x1="478" y1="62" x2="632" y2="62" marker-end="url(#a)"/>
</g>
<g fill="#8b9099">
<circle cx="64" cy="62" r="5"/>
<circle cx="250" cy="62" r="5"/>
<circle cx="460" cy="62" r="5"/>
<circle cx="646" cy="62" r="5"/>
</g>
<g fill="#6b7079" text-anchor="middle">
<text x="154" y="52">ETH in, HAJ out</text>
<text x="355" y="52">fee credited to the position</text>
<text x="555" y="52">collect()</text>
</g>
<g text-anchor="middle">
<text x="64" y="90" fill="#8b9099" font-weight="600">buyer</text>
<text x="64" y="107" fill="#6b7079">any wallet</text>
